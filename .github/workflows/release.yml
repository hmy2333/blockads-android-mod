name: Release

# 打 tag（v*）即自动构建并发布 APK；也可以在 Actions 页面手动触发。
#
# 需要先在 Settings → Secrets and variables → Actions 里配置 4 个 secret：
#   KEYSTORE_BASE64    你的 keystore 的 base64（base64 -w0 keystore.jks）
#   KEYSTORE_PASSWORD  storePassword
#   KEY_ALIAS          keyAlias
#   KEY_PASSWORD       keyPassword
#
# 没有这几个 secret 时构建会在第一步明确失败——这是故意的：
# 用另一把密钥签出来的 APK 无法覆盖安装已有版本。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v7.1.0-mod2）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "releasing $TAG"

      - name: Verify signing secrets
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::缺少 KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD 四个 secret，见本文件头部注释"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: tunnel/go.sum

      - name: Install gomobile
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          echo "$HOME/go/bin" >> $GITHUB_PATH
          "$HOME/go/bin/gomobile" init

      - name: Install Android NDK / platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;26.1.10909125" "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/keystore.jks"
          cat > key.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 "$GITHUB_WORKSPACE/keystore.jks" key.properties

      - name: Build tunnel.aar
        env:
          GOFLAGS: -buildvcs=false
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125"
          mkdir -p build/tunnel
          cd tunnel
          gomobile bind -target=android -androidapi 24 -trimpath \
            -ldflags='-s -w -extldflags=-Wl,-z,max-page-size=16384' \
            -o ../build/tunnel/tunnel.aar github.com/nqmgaming/blockads-tunnel

      - name: Assemble release APKs
        run: ./gradlew -Ptunnel.source=prebuilt :app:assembleFdroidRelease --console=plain

      - name: Checksums
        working-directory: app/build/outputs/apk/fdroid/release
        run: sha256sum *.apk | tee SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        working-directory: app/build/outputs/apk/fdroid/release
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "自动构建（GitHub Actions）。自签构建，与官方签名不同；覆盖安装前请确认已装的是本仓库的构建。" \
            app-fdroid-arm64-v8a-release.apk \
            app-fdroid-armeabi-v7a-release.apk \
            app-fdroid-x86_64-release.apk \
            app-fdroid-universal-release.apk \
            SHA256SUMS.txt

      - name: Clean up signing material
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/keystore.jks" key.properties
